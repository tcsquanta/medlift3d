[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "medlift3d"
version = "0.2.0"
description = "Click-to-3D lung nodule mass and growth assessment from low-dose chest digital tomosynthesis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "matplotlib>=3.7",
                "pyyaml>=6.0", "pydicom>=2.4", "pylidc==0.2.3", "sqlalchemy>=1.4"]

[project.optional-dependencies]
demo = ["gradio>=4.0", "plotly>=5.0"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["medlift3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
